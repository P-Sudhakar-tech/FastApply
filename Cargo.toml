[package]
name = "turboply"
version = "0.1.0"
edition = "2021"
description = "Accelerated drop-in replacement for pandas .apply()"
license = "MIT"
repository = "https://github.com/P-Sudhakar-tech/FastApply"
readme = "README.md"
# Internal dev docs, tooling, and dev-only sources never ship in the sdist
# published to PyPI -- only what's needed to install/rebuild the package.
exclude = [
    "claude.md",
    ".github/**",
    "tests/**",
    "examples/**",
    "benches/**",
    "build.ps1",
    "target.zip",
    ".gitignore",
]

[lib]
name = "_turboply"
# rlib alongside cdylib so `cargo test`/`cargo bench` can link against the
# pure compute cores in src/core.rs directly, without needing an embedded
# Python interpreter (the #[pyfunction] wrappers in lib.rs need a live GIL
# token and can't be called from a plain Rust test/bench binary).
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.10"
numpy = "0.29"
regex = "1.10"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "native_benches"
harness = false

[profile.release]
lto = true
codegen-units = 1
